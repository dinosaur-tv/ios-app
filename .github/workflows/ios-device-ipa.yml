name: iOS Device IPA (Sideload)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Homebrew
        run: |
          brew uninstall --force bicep 2>/dev/null || true
          brew untap --force aws/tap 2>/dev/null || true
          brew untap --force azure/bicep 2>/dev/null || true

      - name: Install build tools
        run: brew install swiftlint xcodegen

      - name: Run SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project DinoHome.xcodeproj \
            -scheme DinoHome \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=DinoHome/DinoHome-Sideload.entitlements \
            build

      - name: Package IPA
        run: |
          APP_PATH="$(ls -d DerivedData/Build/Products/Release-iphoneos/*.app)"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r DinoHome-Device.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v6
        with:
          name: DinoHome-Device
          path: DinoHome-Device.ipa
          retention-days: 14
