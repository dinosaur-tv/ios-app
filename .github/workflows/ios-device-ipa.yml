name: iOS Device IPA (Sideload)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HOMEBREW_NO_ENV_HINTS: "1"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Prepare Homebrew
        run: |
          brew uninstall --force bicep 2>/dev/null || true
          brew untap --force aws/tap 2>/dev/null || true
          brew untap --force azure/bicep 2>/dev/null || true

      - name: Install build tools
        run: brew install swiftlint xcodegen

      - name: Run SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project DinoHome.xcodeproj \
            -scheme DinoHome \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=DinoHome/DinoHome-Sideload.entitlements \
            build

      - name: Package IPA
        run: |
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/DinoHome.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r DinoHome-Device.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v6
        with:
          name: DinoHome-Device
          path: DinoHome-Device.ipa
          retention-days: 14

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv DinoHome-Device.ipa "DinoHome-${GITHUB_REF_NAME}-unsigned.ipa"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Dino Home $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "DinoHome-${GITHUB_REF_NAME}-unsigned.ipa" --clobber
