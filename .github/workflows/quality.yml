name: iOS quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen swiftlint
      - run: xcodegen generate
      - run: swiftlint lint --strict
      - name: Build for testing
        run: xcodebuild build-for-testing -project DinoHome.xcodeproj -scheme DinoHome -destination 'platform=iOS Simulator,name=iPhone 16,arch=arm64' -derivedDataPath DerivedData
      - name: Verify bundle identifier
        run: /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' DerivedData/Build/Products/Debug-iphonesimulator/DinoHome.app/Info.plist
      - name: Test
        run: xcodebuild test-without-building -project DinoHome.xcodeproj -scheme DinoHome -destination 'platform=iOS Simulator,name=iPhone 16,arch=arm64' -derivedDataPath DerivedData
