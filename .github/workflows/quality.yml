name: iOS quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen swiftlint
      - run: xcodegen generate
      - run: swiftlint lint --strict
      # Runner images retire simulator models, so ask the runner what it has instead of naming one.
      - name: Choose a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          groups = json.load(sys.stdin)["devices"]
          devices = [d for runtime, items in groups.items() if "iOS" in runtime for d in items if d.get("isAvailable")]
          phones = [d for d in devices if d["name"].startswith("iPhone")] or devices
          print(phones[-1]["udid"] if phones else "")
          ')
          if [ -z "$udid" ]; then
            echo "This runner has no available iOS simulator:"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep -F "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build for testing
        run: xcodebuild build-for-testing -project DinoHome.xcodeproj -scheme DinoHome -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" -derivedDataPath DerivedData
      - name: Verify bundle identifier
        run: /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' DerivedData/Build/Products/Debug-iphonesimulator/DinoHome.app/Info.plist
      - name: Test
        run: xcodebuild test-without-building -project DinoHome.xcodeproj -scheme DinoHome -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" -derivedDataPath DerivedData
