name: iOS quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen swiftlint
      - run: xcodegen generate
      - run: swiftlint lint --strict
      - run: xcodebuild test -project DinoHome.xcodeproj -scheme DinoHome -destination 'platform=iOS Simulator,name=iPhone 16'
